name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master
      - test

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.app-changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for application code changes
        id: app-changes
        uses: tj-actions/changed-files@v44
        with:
          files: |
            weatherStation/**
            Dockerfile

      - name: Show changed files
        run: |
          echo "=== Application Changes ==="
          echo "Changed: ${{ steps.app-changes.outputs.any_changed }}"
          echo "Files: ${{ steps.app-changes.outputs.all_changed_files }}"
          echo ""
  build-and-test:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run tests
        run: dotnet test --configuration Release
